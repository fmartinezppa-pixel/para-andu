<!doctype html>
<!-- Para Andu. Contenido encriptado en #vault (PBKDF2-SHA256 + AES-GCM-256). -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Para Andu</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Andu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="st">
:root{
  --bg:#222b1e; --bg2:#2b3626; --moss:#5b6b45; --moss-d:#3e4a31;
  --ink:#e3e6d1; --muted:#a9b096; --paper:#d8dcc2; --paper-ink:#273022;
  --gold:#c99d3f; --gold-soft:#e2c27a; --line:#46523c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e2e5d0; --bg2:#d4d9bf; --moss:#56663f; --moss-d:#3e4a31;
    --ink:#253021; --muted:#59634b; --paper:#f0f1e4; --paper-ink:#273022;
    --gold:#a67c22; --gold-soft:#8a6516; --line:#b5bd9c;
  }
}
:root[data-theme="dark"]{
  --bg:#222b1e; --bg2:#2b3626; --moss:#5b6b45; --moss-d:#3e4a31;
  --ink:#e3e6d1; --muted:#a9b096; --paper:#d8dcc2; --paper-ink:#273022;
  --gold:#c99d3f; --gold-soft:#e2c27a; --line:#46523c;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Karla,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
h1,h2{font-family:"Young Serif",Georgia,serif;font-weight:400;margin:0;line-height:1.15}
.wrap{max-width:720px;margin:0 auto;padding:0 22px}

/* lock */
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.lock-box{width:100%;max-width:360px;text-align:center}
.lock-box h1{font-size:2.3rem;margin:18px 0 6px}
.lock-box p{color:var(--muted);margin:0 0 24px}
.lock-box label{display:block;text-align:left;font-weight:500;margin-bottom:8px}
.lock-row{display:flex;gap:8px}
.lock-row input{flex:1;min-width:0;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2)}
.btn{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:var(--moss);color:#f1f2e6;font-weight:700}
.btn:hover{background:var(--moss-d)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:.88rem;border-radius:8px}
.err{color:var(--gold-soft);min-height:1.6em;margin-top:12px;font-size:.95rem}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* hero */
.hero{padding:88px 0 56px}
.hero h1{font-size:clamp(3rem,11vw,5.6rem);letter-spacing:-.01em}
.hero .since{font-size:1.2rem;max-width:30em;margin:18px 0 0;color:var(--muted)}
.hero .since b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.hero .month{margin-top:14px;font-family:Caveat,cursive;font-size:1.6rem;color:var(--gold-soft)}

section{padding:44px 0;border-top:1px solid var(--line)}
section h2{font-size:1.9rem;margin-bottom:6px}
section .lede{color:var(--muted);margin:0 0 26px}

/* envelopes */
.envs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.env{position:relative;cursor:pointer;border:0;padding:0;background:var(--paper);color:var(--paper-ink);border-radius:6px;aspect-ratio:1.55;overflow:hidden;text-align:left;box-shadow:0 2px 0 var(--moss-d);transition:transform .2s}
.env:hover{transform:translateY(-3px) rotate(-1deg)}
.env::before{content:"";position:absolute;inset:0 0 auto 0;height:40%;background:color-mix(in srgb,var(--paper) 82%,var(--moss));clip-path:polygon(0 0,100% 0,50% 100%)}
.env .seal{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--moss-d);color:var(--gold-soft);display:grid;place-items:center;font-family:"Young Serif",serif;font-size:1rem;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--moss-d) 70%,#000)}
.env .lbl{position:absolute;left:14px;right:14px;top:calc(40% + 20px);bottom:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Caveat,cursive;font-size:clamp(1.1rem,4.5vw,1.3rem);line-height:1.1;overflow:hidden}
dialog{border:0;padding:0;background:transparent;max-width:min(560px,92vw);width:100%}
dialog::backdrop{background:rgba(15,20,12,.7)}
.letter{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:34px 30px 26px;animation:op .4s ease-out}
@keyframes op{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.letter h3{font-family:"Young Serif",serif;font-weight:400;font-size:1.4rem;margin:0 0 14px}
.letter .body{font-family:Caveat,cursive;font-size:1.55rem;line-height:1.35;white-space:pre-wrap}
.letter .close{margin-top:20px;background:var(--moss-d);color:#f1f2e6}

/* wall */
.notes{display:grid;gap:16px}
.note{background:var(--paper);color:var(--paper-ink);padding:18px 22px;border-radius:4px;max-width:560px}
.note:nth-child(even){margin-left:auto;transform:rotate(.6deg)}
.note:nth-child(odd){transform:rotate(-.5deg)}
.note .txt{font-family:Caveat,cursive;font-size:1.5rem;line-height:1.3;white-space:pre-wrap}
.note .d{font-size:.82rem;color:#5b6650;margin-top:6px}

/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--moss)}
.tl li{position:relative;padding:0 0 26px 16px}
.tl li::before{content:"";position:absolute;left:-30px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid var(--bg)}
.tl .when{color:var(--gold-soft);font-weight:700;font-size:.92rem}
.tl .what{font-family:"Young Serif",serif;font-size:1.25rem;margin:2px 0}
.tl .mes{display:inline-block;margin-left:6px;padding:1px 9px 2px;border-radius:999px;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold-soft);font-family:Caveat,cursive;font-weight:700;font-size:1.15rem;line-height:1.2;white-space:nowrap}
.tl .more{color:var(--muted);margin:0}

/* mimo */
.mimo{display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.mimo-out{font-family:Caveat,cursive;font-size:clamp(1.8rem,6vw,2.4rem);line-height:1.2;min-height:2.6em;color:var(--gold-soft)}
.mimo-out.pop{animation:pop .45s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

footer{padding:40px 0 60px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}

/* aniversario */
.aniv{max-width:min(620px,94vw)}
.aniv .letter{text-align:center;padding:44px 30px 30px;position:relative;overflow:hidden}
.aniv .big{font-family:"Young Serif",Georgia,serif;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1.05;margin:14px 0 18px;color:var(--moss-d)}
.aniv .body{font-family:Caveat,cursive;font-size:1.6rem;line-height:1.35;white-space:pre-wrap;max-width:26em;margin:0 auto}
.aniv .close{margin-top:24px;background:var(--moss-d);color:#f1f2e6}
.aniv .hrt{position:absolute;bottom:-20px;color:var(--gold);font-size:18px;opacity:0;animation:up 3.2s ease-out forwards;pointer-events:none}
@keyframes up{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-420px) scale(1.2)}}
.month{cursor:pointer;background:none;border:0;padding:0}

/* editing */
.ed{display:none}
body.editing .ed{display:block}
.ed-box{background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:14px;margin-top:14px}
.ed-box input,.ed-box textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);margin-bottom:8px}
.ed-box textarea{min-height:90px;resize:vertical}
.ed-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed-hint{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.edbar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
.edbar .btn{box-shadow:0 4px 14px rgba(0,0,0,.3)}
.music{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;width:46px;height:46px;border-radius:50%;border:0;padding:0;cursor:pointer;display:grid;place-items:center;background:var(--moss-d);color:var(--gold-soft);font-size:1.35rem;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:opacity .2s}
.music.off{opacity:.55}
.music.on{animation:latido 2.4s ease-in-out infinite}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.music.on{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--paper-ink);padding:10px 16px;border-radius:10px;font-size:.95rem;z-index:6}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

(function init(){
  try { localStorage.removeItem('andu-key'); } catch(e){}
  var k = store('andu-key');
  if (!k || !window.crypto || !crypto.subtle) return renderLock();
  openWith(unb64(k)).then(enterApp).catch(function(){
    try { sessionStorage.removeItem('andu-key'); } catch(e){}
    renderLock();
  });
})();
})();
</script>
</body>
